# DDPM config used for DDPM training
ddpm:
  data:
    root: ???
    name: "Age"
    image_size: 96
    hflip: False
    n_channels: 3
    norm: False
    ddpm_latent_path: ""

  model:
    dim : 128
    attn_resolutions: "16,"
    n_residual: 2
    dim_mults: "1,2,2,2,4"
    dropout: 0.1
    n_heads: 1
    beta1: 0.0001
    beta2: 0.02
    n_timesteps: 1000

  evaluation:
    chkpt_path: ???
    save_path: ???
    z_cond: True
    z_dim: 4
    guidance_weight: 0.0
    type: 'form1'
    resample_strategy: "spaced"
    skip_strategy: "uniform"
    sample_method: "ddpm"
    sample_from: "target"
    seed: 42
    device: "gpu:1"
    n_samples: 50000
    n_steps: 1000
    workers: 2
    batch_size: 8
    save_vae: False
    variance: "fixedlarge"
    sample_prefix: ""
    temp: 1.0
    save_mode: image
    mask: ???
    value: ???
  
  interpolation:
    n_steps: 10

# VAE config used for VAE training
vae:
  data:
    root: ???
    name: "Age"
    image_size: 96
    n_channels: 4

  model:
    z_dim: 16
    #enc_block_config : "64x7,64d2,64t32,32x4,32d2,32t16,16x7,16d2,16t8,8x3,8d2,8t4,4x3,4d4,4t1,1x2"
